<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Arav Madan — infrastructure for AI agents">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111f3d"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="260" fill="url(#bg)"/>

  <!-- faint grid, keeps the field from reading flat -->
  <g stroke="#7dd3fc" stroke-opacity="0.06" stroke-width="1">
    <path d="M0 65h1200M0 130h1200M0 195h1200"/>
    <path d="M200 0v260M400 0v260M600 0v260M800 0v260M1000 0v260"/>
  </g>

  <text x="72" y="118" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="60" font-weight="600" fill="#f8fafc" letter-spacing="-1.2">Arav Madan</text>

  <rect x="74" y="140" width="132" height="3" rx="1.5" fill="url(#rule)"/>

  <text x="72" y="182" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="21" fill="#94a3b8" letter-spacing="0.2">Infrastructure for AI agents — measuring them, and containing them.</text>

  <text x="72" y="216" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace"
        font-size="15" fill="#64748b" letter-spacing="0.6">BSc Computer Science &amp; Engineering · TU/e · Eindhoven</text>
</svg>
